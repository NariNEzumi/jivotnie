{% extends "base.html" %}

{% block title %}Заявка на усыновление{% endblock %}

{% block content %}
<section class="auth-form">
    <div class="container">
        <div class="form-container">
            <h2>📋 Заявка на {{ animal[1] }}</h2>
            <div style="background: #f0f2f5; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                <p><strong> {{ animal[1] }}</strong> — {{ animal[3] }}, {{ animal[4] }}</p>
            </div>
            
            <form method="POST">
                <div class="form-group">
                    <label>Ваше имя *</label>
                    <input type="text" name="user_name" required>
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" name="user_phone" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="user_email" required>
                </div>
                <div class="form-group">
                    <label>Расскажите о себе и условиях содержания</label>
                    <textarea name="message" rows="5" placeholder="Например: есть ли у вас другие животные, живёте ли вы в квартире/доме, есть ли дети и т.д."></textarea>
                </div>
                <button type="submit" class="btn-primary">Отправить заявку</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
