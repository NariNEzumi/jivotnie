{% extends "base.html" %}

{% block title %}Редактировать животное{% endblock %}

{% block content %}
<section class="admin-form">
    <div class="container">
        <div class="form-container">
            <h2> Редактировать: {{ animal[1] }}</h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" name="name" value="{{ animal[1] }}" required>
                </div>
                <div class="form-group">
                    <label>Тип</label>
                    <select name="type">
                        <option {% if animal[2]=='Кошка' %}selected{% endif %}>Кошка</option>
                        <option {% if animal[2]=='Собака' %}selected{% endif %}>Собака</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Порода</label>
                    <input type="text" name="breed" value="{{ animal[3] }}">
                </div>
                <div class="form-group">
                    <label>Возраст</label>
                    <input type="text" name="age" value="{{ animal[4] }}">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea name="description" rows="5">{{ animal[5] }}</textarea>
                </div>
                <div class="form-group">
                    <label>Статус</label>
                    <select name="status">
                        <option value="available" {% if animal[7]=='available' %}selected{% endif %}>Доступен</option>
                        <option value="adopted" {% if animal[7]=='adopted' %}selected{% endif %}>Забран</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Новое фото (оставьте пустым, чтобы не менять)</label>
                    <input type="file" name="photo" accept="image/*">
                </div>
                <button type="submit" class="btn-primary">Сохранить изменения</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
